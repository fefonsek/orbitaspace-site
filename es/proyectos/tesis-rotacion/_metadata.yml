# Caso TCC (PT, ES e EN). Com freeze: auto, o Quarto só roda o R desta
# página de novo quando o index.qmd muda; nos outros renders reaproveita o
# resultado guardado em _freeze/ (que vai para o Git). Quando a análise, os
# textos ou os gráficos mudam, o render.ps1 descarta esse resultado sozinho.
execute:
  freeze: auto
