# Tabela das três definições, na ordem de dados/definicoes.csv:
# [campo, RH, Operação, Financeiro]
definicoes:
  - [Question it answers, How much of the contracted time was lost?, How many scheduled shifts went uncovered?, How much do we pay for hours not worked?]
  - [Numerator, "Absence hours of every type, including long-term absences", "Scheduled days with any absence, including late arrivals or early departures of more than 10 minutes", "Absence hours paid by the company: doctor's notes, the first 15 days of sick or injury leave, and statutory leave"]
  - [Denominator, Scheduled working hours, Scheduled days (people absent for more than 15 days come off the schedule), Scheduled working hours]
  - [Unit, Hours, Days, Hours]
  - [Name after the project, "**Absenteeism rate** (official, goes to leadership)", Schedule absence rate (managed by Operations), Cost of paid hours not worked (managed by Finance)]
