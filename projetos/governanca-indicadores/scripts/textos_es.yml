# Caso Indicadores: textos dos dados em espanhol. As chaves são as dos
# arquivos em português de dados/ (número do indicador, código da ficha,
# nome em PT); os números continuam vindo dos dados. Ver scripts/rotulos.R.

areas:
  Financeiro: Finanzas
  Comercial: Comercial
  Operação: Operaciones
  Qualidade: Calidad
  RH: RR. HH.
  SESMT: SST

situacoes:
  Bem definido: [Bien definido, "Fórmula escrita, fuente única, dueño y uso en alguna decisión"]
  Divergente: [Divergente, "Mismo nombre, cálculos distintos entre áreas o unidades"]
  Duplicado: [Duplicado, "Nombres distintos para la misma medida, o uno es un recorte del otro"]
  Mal formulado: [Mal formulado, "Volumen sin referencia, recorte tratado como indicador o incentivo equivocado"]
  Sem uso: [Sin uso, "No apareció en ninguna decisión registrada en acta en los últimos seis meses"]
  Sem dono: [Sin dueño, "Nadie responde por el resultado ni por el cálculo"]

destinos:
  Diretoria: [Dirección, "Va a la reunión mensual, con ficha completa, meta y dueño"]
  Gestão da área: [Gestión del área, "El área lo sigue con una ficha simplificada; sube a la dirección solo por excepción"]
  Unificado: [Unificado, "Pasa a ser parte de otro indicador o un desglose de él"]
  Descontinuado: [Discontinuado, "Sale de las presentaciones; la base sigue disponible"]

pilares:
  Finanças: [Finanzas, Crecer con margen]
  Clientes: [Clientes, Entregar a tiempo]
  Operação: [Operación, Precisión y eficiencia]
  Pessoas: [Personas, Presencia y seguridad]

