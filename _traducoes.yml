# Páginas equivalentes nos três idiomas.
# Cada página indica no cabeçalho a sua chave (ex.: "traducao: projetos").
# O filtro assets/lua/traducoes.lua usa esta tabela para gerar os links
# hreflang e o seletor PT | ES | EN aponta para eles.
# Um post do blog só entra aqui se tiver tradução; sem entrada, o seletor
# leva para o blog do outro idioma.

