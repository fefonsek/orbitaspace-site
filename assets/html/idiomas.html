<script>
// 1. Seletor PT | ES | EN: aponta cada idioma para a versão correspondente
//    desta página (links hreflang do cabeçalho, vindos de _traducoes.yml).
//    Sem versão correspondente, leva para o blog do idioma (se estamos no
//    blog), para a lista de projetos (se estamos num projeto que só existe
//    em português) ou para a página inicial. Na página de Projetos, leva o
//    filtro ?frente= junto (as chaves são as mesmas nas três línguas).
// 2. Faixa de idioma: se o navegador está em espanhol ou inglês e a página
//    está em outra língua, sugere a versão no idioma do navegador. Nunca
//    redireciona. Fechar a faixa ou escolher um idioma no seletor é lembrado.
// 3. Botão "Copiar e-mail" da página de contato.
// 4. Fecho (bordão e faixa de arte, de assets/lua/faixa.lua): sai do fim do
//    conteúdo e vai para logo acima do rodapé, na largura total da tela.
// 5. Página da Saline Astral: o único item do menu, "Início", leva à própria
//    página e aparece como atual (o CSS esconde os outros itens).
document.addEventListener("DOMContentLoaded", function () {
  // 4. Fecho
  var fecho = document.querySelector(".fecho-site");
  var rodape = document.querySelector("footer.footer");
  if (fecho && rodape) rodape.parentNode.insertBefore(fecho, rodape);

  // 5. Saline
  if (document.body.classList.contains("pagina-saline")) {
    var inicioSaline = document.querySelector(".navbar .navbar-nav.me-auto .nav-link");
    if (inicioSaline) {
      inicioSaline.href = location.pathname;
      inicioSaline.classList.add("active");
      inicioSaline.setAttribute("aria-current", "page");
    }
  }

  var codigos = { PT: "pt-BR", ES: "es", EN: "en" };
  var inicio = { PT: "/", ES: "/es/", EN: "/en/" };
  var blog = { PT: "/blog.html", ES: "/es/blog.html", EN: "/en/blog.html" };
  var projetos = { PT: "/projetos.html", ES: "/es/proyectos.html", EN: "/en/projects.html" };
  var atual = document.documentElement.lang;
  var noBlog = /\/blog(\/|\.html)/.test(location.pathname);
  var noProjeto = /^\/projetos\//.test(location.pathname);
  var CHAVE_FAIXA = "orbita-faixa-idioma";

  function lembrar() {
    try { localStorage.setItem(CHAVE_FAIXA, "escolhido"); } catch (e) {}
  }

  function caminho(rotulo) {
    var alt = document.querySelector('link[rel="alternate"][hreflang="' + codigos[rotulo] + '"]');
    if (alt) return new URL(alt.href).pathname;
    if (codigos[rotulo] === atual) return location.pathname;
    if (noBlog) return blog[rotulo];
    return noProjeto ? projetos[rotulo] : inicio[rotulo];
  }

  function versao(rotulo) {
    var destino = caminho(rotulo);
    var frente = new URLSearchParams(location.search).get("frente");
    if (frente && destino === projetos[rotulo]) destino += "?frente=" + encodeURIComponent(frente);
    return destino;
  }

  // Links que apontam para outro idioma; o filtro de Projetos os atualiza.
  var links = [];
  window.addEventListener("orbita:frente", function () {
    links.forEach(function (par) { par.link.href = versao(par.rotulo); });
  });

  // 1. Seletor
  document.querySelectorAll(".navbar .nav-link").forEach(function (link) {
    var rotulo = link.textContent.trim();
    if (!codigos[rotulo]) return;
    var item = link.closest(".nav-item");
    if (item) item.classList.add("nav-idioma");
    link.classList.remove("active");
    link.href = versao(rotulo);
    links.push({ link: link, rotulo: rotulo });
    link.hreflang = codigos[rotulo];
    link.addEventListener("click", lembrar);
    if (codigos[rotulo] === atual) {
      link.classList.add("idioma-atual");
      link.setAttribute("aria-current", "true");
    }
  });

  // 2. Faixa de idioma
  (function faixaIdioma() {
    try {
      if (localStorage.getItem(CHAVE_FAIXA)) return;
    } catch (e) {}
    var preferido = ((navigator.languages && navigator.languages[0]) || navigator.language || "").slice(0, 2).toLowerCase();
    var textos = {
      es: { rotulo: "ES", frase: "Este sitio también está en español.", link: "Ver en español", fechar: "Cerrar" },
      en: { rotulo: "EN", frase: "This site is also available in English.", link: "View in English", fechar: "Close" }
    };
    var t = textos[preferido];
    if (!t || atual.slice(0, 2) === preferido) return;

    var faixa = document.createElement("div");
    faixa.className = "faixa-idioma";
    faixa.lang = preferido;
    faixa.setAttribute("role", "region");
    faixa.setAttribute("aria-label", t.link);

    var texto = document.createElement("p");
    texto.appendChild(document.createTextNode(t.frase + " "));
    var link = document.createElement("a");
    link.href = versao(t.rotulo);
    links.push({ link: link, rotulo: t.rotulo });
    link.hreflang = preferido;
    link.textContent = t.link;
    link.addEventListener("click", lembrar);
    texto.appendChild(link);

    var fechar = document.createElement("button");
    fechar.type = "button";
    fechar.className = "faixa-fechar";
    fechar.setAttribute("aria-label", t.fechar);
    fechar.innerHTML = "&times;";
    fechar.addEventListener("click", function () {
      faixa.remove();
      lembrar();
    });

    faixa.appendChild(texto);
    faixa.appendChild(fechar);
    document.body.insertBefore(faixa, document.body.firstChild);
  })();

  // 3. Copiar e-mail
  document.querySelectorAll(".copiar-email").forEach(function (botao) {
    var original = botao.textContent;
    botao.addEventListener("click", function () {
      var email = botao.getAttribute("data-email");
      var copiado = function () {
        botao.textContent = botao.getAttribute("data-copiado");
        setTimeout(function () { botao.textContent = original; }, 2000);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(email).then(copiado, function () {});
      } else {
        var campo = document.createElement("textarea");
        campo.value = email;
        campo.setAttribute("readonly", "");
        campo.style.position = "absolute";
        campo.style.left = "-9999px";
        document.body.appendChild(campo);
        campo.select();
        try { if (document.execCommand("copy")) copiado(); } catch (e) {}
        campo.remove();
      }
    });
  });
});
</script>
